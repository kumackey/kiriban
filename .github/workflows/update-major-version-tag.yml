name: Update Major Version Tag

on:
  push:
    tags:
      - "v*"

# Moving the major version tag is the only write this workflow needs.
permissions:
  contents: write

jobs:
  update-majorver:
    name: Update Major Version Tag
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit SHA: this workflow hands a write-scoped token to a
      # third-party action, so a moved tag would be a code execution vector.
      - uses: nowactions/update-majorver@f2014bbbba95b635e990ce512c5653bd0f4753fb # v1.1.2

name: 'Kiriban'
description: 'This is a GitHub Actions that will congratulate you when you reach kiriban for your issue or pull request number.'
author: 'kumackey <kumak1t09e0@gmail.com>'
inputs:
  LOCALE:
    description: 'Locale'
    required: false
    default: 'en'
  USER_DEFINED_KIRIBANS:
    description: 'User-defined kiribans'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - run: |
        if [[ "$EVENT_NAME" == "issues" ]]; then
          NUMBER="$ISSUE_NUMBER"
        elif [[ "$EVENT_NAME" == "pull_request" ]]; then
          NUMBER="$PULL_REQUEST_NUMBER"
        else
          echo "Unsupported event name: $EVENT_NAME"
          exit 1
        fi
        go run ./cmd/actions -t "$EVENT_NAME" -u "$USER_DEFINED_KIRIBANS" "$NUMBER"
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        LOCALE: ${{ inputs.LOCALE }}
        USER_DEFINED_KIRIBANS: ${{ inputs.USER_DEFINED_KIRIBANS }}
        EVENT_NAME: ${{ github.event_name }}
        ISSUE_NUMBER: ${{ github.event.issue.number }}
        PULL_REQUEST_NUMBER: ${{ github.event.number }}
branding:
  icon: 'gift'
  color: 'orange'
